<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player-container">
    <h2>Music Player</h2>

    <!-- Widget Pemutar Lagu SoundCloud -->
    <iframe id="sc-widget" 
            width="100%" 
            height="166" 
            scrolling="no" 
            frameborder="no" 
            allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%231db954&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
    </iframe>
  </div>

  <!-- Script API Resmi SoundCloud -->
  <script src="https://w.soundcloud.com/player/api.js"></script>
</body>
</html>
