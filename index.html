<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Player Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sc-card">
    <div class="sc-header">
      <span class="sc-logo">☁️ SOUNDCLOUD</span>
    </div>
    
    <!-- Widget Pemutar SoundCloud dengan Tema Warna Oranye (#ff5500) -->
    <iframe id="sc-widget" 
            width="100%" 
            height="166" 
            scrolling="no" 
            frameborder="no" 
            allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true">
    </iframe>
  </div>
</body>
</html>
