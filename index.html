<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR ATAS -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo">
        <svg height="22" viewBox="0 0 48 24" fill="#fff"><path d="M12 18h31c2.8 0 5-2.2 5-5s-2.2-5-5-5c-.2 0-.4 0-.6.1C41.6 5 38.6 3 35 3c-4.4 0-8 3.6-8 8 0 .3 0 .7.1 1M0 18h2v-6H0v6zm4 0h2V9H4v9zm4 0h2V7H8v11zm4 0h2V6h-2v12z"/></svg>
        <span>SOUNDCLOUD</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Feed</a>
        <a href="#">Library</a>
      </nav>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search for artists, bands, tracks, podcasts">
    </div>

    <div class="nav-right">
      <button class="btn-secondary">Sign in</button>
      <button class="btn-primary">Create account</button>
      <a href="#" class="upload-link">Upload</a>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <div class="main-container">
    <main class="content-area">
      <h1>Discover Tracks and Playlists</h1>

      <section class="music-section">
        <h2>Trending by genre</h2>
        <div class="card-grid">
          
          <!-- Tambahkan atribut data-src berisi URL audio sampel -->
          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Trap Song">
            <div class="card-cover genre-red"><span class="play-icon">▶</span></div>
            <p class="title">Trap</p>
            <p class="subtitle">Klik untuk Putar</p>
          </div>

          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Soundcloud Beat">
            <div class="card-cover genre-red"><span class="play-icon">▶</span></div>
            <p class="title">Soundcloud</p>
            <p class="subtitle">Klik untuk Putar</p>
          </div>

          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" data-title="Hip Hop Vibe">
            <div class="card-cover genre-red"><span class="play-icon">▶</span></div>
            <p class="title">Hip Hop</p>
            <p class="subtitle">Klik untuk Putar</p>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- PEMUTAR MUSIK MELAYANG DI BAWAH (PLAYER BAR) -->
  <div class="bottom-player">
    <span id="now-playing">Pilih lagu untuk memutar</span>
    <audio id="global-audio" controls></audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
