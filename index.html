<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kucay Cloud</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111111;
      color: #ffffff;
      padding-bottom: 80px; /* Jarak untuk player bar di bawah */
    }

    /* NAVBAR */
    .navbar {
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
    }

    .nav-links a {
      color: #999;
      text-decoration: none;
      font-size: 14px;
      margin-right: 15px;
    }

    .nav-links a.active, .nav-links a:hover {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 5px;
    }

    .search-box input {
      background-color: #222;
      border: none;
      border-radius: 4px;
      padding: 8px 15px;
      width: 320px;
      color: #fff;
      font-size: 13px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .upload-link {
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
    }

    /* LAYOUT UTAMA */
    .main-container {
      max-width: 1240px;
      margin: 20px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    .music-section {
      margin-bottom: 35px;
    }

    .music-section h2 {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 15px;
    }

    /* GRID LAGU / CARD */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }

    .card {
      cursor: pointer;
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 4px;
      margin-bottom: 8px;
      background-color: #e5533d;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .card:hover .card-cover {
      transform: translateY(-4px);
    }

    .play-icon {
      font-size: 28px;
      color: #fff;
      opacity: 0.8;
    }

    .card .title {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card .subtitle {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PLAYER BAR DI BAWAH */
    .sc-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #f2f2f2;
      border-top: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 1000;
      color: #333;
    }

    .sc-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .sc-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #333;
    }

    .play-main {
      font-size: 22px;
      color: #ff5500;
    }

    .sc-progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 600px;
      margin: 0 20px;
      font-size: 11px;
      color: #ff5500;
    }

    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background-color: #ccc;
      border-radius: 2px;
      cursor: pointer;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #ff5500;
      border-radius: 2px;
    }

    .sc-track-info {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 220px;
    }

    .mini-cover {
      width: 30px;
      height: 30px;
      background-color: #e5533d;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      font-size: 14px;
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    #track-artist {
      font-size: 11px;
      color: #999;
    }

    #track-title {
      font-size: 12px;
      color: #333;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo">
        <svg height="22" viewBox="0 0 48 24" fill="#fff"><path d="M12 18h31c2.8 0 5-2.2 5-5s-2.2-5-5-5c-.2 0-.4 0-.6.1C41.6 5 38.6 3 35 3c-4.4 0-8 3.6-8 8 0 .3 0 .7.1 1M0 18h2v-6H0v6zm4 0h2V9H4v9zm4 0h2V7H8v11zm4 0h2V6h-2v12z"/></svg>
        <span>KUCAYCLOUD</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Feed</a>
        <a href="#">Library</a>
      </nav>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search for artists, bands, tracks, podcasts">
    </div>

    <div class="nav-right">
      <button class="btn-secondary">Sign in</button>
      <button class="btn-primary">Create account</button>
      <a href="#" class="upload-link">Upload</a>
    </div>
  </header>

  <!-- KONTEN -->
  <div class="main-container">
    <main class="content-area">
      <h1>Discover Tracks and Playlists</h1>

      <section class="music-section">
        <h2>Trending Tracks</h2>
        <div class="card-grid">
          
          <!-- LAGU DJ OCYN BERHASIL DIHUBUNGKAN LANGSUNG -->
          <div class="card" 
               data-src="https://api.downloadscloudmp3.com/download?url=https%3A%2F%2Fsoundcloud.com%2Fdjocyn%2Feeee-a-dj-ocyn-edit-pitched-up&format=mp3&title=EEEE%20A%20%28DJ%20Ocyn%20Edit%29%20%5BPITCHED%20UP%5D&exp=1787105669&sig=ee8e2d1d6f20ad5dc5cb326bb063959d9ebf2a345ea2644a48a34be1b5371c24" 
               data-title="EEEE A (Edit Pitched Up)" 
               data-artist="DJ Ocyn">
            <div class="card-cover" style="background-color: #ff5500;"><span class="play-icon">▶</span></div>
            <p class="title">EEEE A</p>
            <p class="subtitle">DJ Ocyn Edit</p>
          </div>

          <!-- LAGU SAMPLE 1 -->
          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Trap Vibes" data-artist="Trending Genre">
            <div class="card-cover"><span class="play-icon">▶</span></div>
            <p class="title">Trap</p>
            <p class="subtitle">Trending</p>
          </div>

          <!-- LAGU SAMPLE 2 -->
          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Soundcloud Beat" data-artist="Soundcloud Official">
            <div class="card-cover"><span class="play-icon">▶</span></div>
            <p class="title">Soundcloud</p>
            <p class="subtitle">Trending</p>
          </div>

          <!-- LAGU SAMPLE 3 -->
          <div class="card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" data-title="Hip Hop Chill" data-artist="Lo-Fi Master">
            <div class="card-cover"><span class="play-icon">▶</span></div>
            <p class="title">Hip Hop</p>
            <p class="subtitle">Trending</p>
          </div>

        </div>
      </section>
    </main>
  </div>

  <audio id="global-audio"></audio>

  <!-- PLAYER BAR DI BAWAH -->
  <div class="sc-player-bar">
    <div class="sc-controls">
      <button id="prev-btn" class="sc-btn">⏮</button>
      <button id="play-btn" class="sc-btn play-main">▶</button>
      <button id="next-btn" class="sc-btn">⏭</button>
    </div>

    <div class="sc-progress-container">
      <span id="current-time">0:00</span>
      <div class="progress-bar-bg" id="progress-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span id="duration-time">0:00</span>
    </div>

    <div class="sc-track-info">
      <div class="mini-cover">🎵</div>
      <div class="track-details">
        <span id="track-artist">Pilih Lagu</span>
        <span id="track-title">Belum ada lagu diputar</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
