<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player-container">
    <h2>SoundCloud Player</h2>

    <!-- Embed Player dari SoundCloud -->
    <iframe id="sc-widget" 
            width="100%" 
            height="166" 
            scrolling="no" 
            frameborder="no" 
            allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true">
    </iframe>

    <div class="controls" style="margin-top: 15px;">
      <button id="play-btn">Play / Pause via JS</button>
    </div>
  </div>

  <!-- Load SoundCloud Widget API Script -->
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    const iframeElement = document.getElementById('sc-widget');
    const widget = SC.Widget(iframeElement);
    const playBtn = document.getElementById('play-btn');

    playBtn.addEventListener('click', () => {
      widget.toggle(); // Mengontrol Play/Pause menggunakan JavaScript
    });
  </script>
</body>
</html>
